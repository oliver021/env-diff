name: env-diff
on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Audit local env files and upload findings to GitHub code-scanning.
      - name: Run env-diff audit
        run: |
          npx -y @node-utils/env-diff audit .env.example \
            --output sarif \
            --min-severity medium > env-diff.sarif
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: env-diff.sarif

      # Multi-file matrix diff: catch keys present in production but missing
      # in staging or example files.
      - name: Compare env files
        run: |
          npx -y @node-utils/env-diff compare \
            .env.example .env.staging .env.production \
            --ignore-values --fail-on-diff
